<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Server Test</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6LdjF_8rAAAAAB8GOKLPslNY6xVyPiqjdk6kY2sg"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .config-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .config-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .response-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .response-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        #response {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: 600;
        }

        .success {
            color: #27ae60;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box p {
            color: #1976d2;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 API Server Test</h1>

        <div class="config-section">
            <h2>⚙️ 設定</h2>
            <div class="info-box">
                <p><strong>🔒 リファラー制限付きAPIキー:</strong> このAPIキーはローカルホスト（file://、http://localhost:*、http://127.0.0.1:*）からのみ使用可能です</p>
                <p><strong>💡 ヒント:</strong> デフォルト値が設定されているので、そのままボタンをクリックしてテストできます</p>
            </div>
            <div class="input-group">
                <label for="gatewayUrl">API Gateway URL</label>
                <input type="text" id="gatewayUrl" value="api-gateway-dh1fxfxf.an.gateway.dev">
            </div>
            <div class="input-group">
                <label for="apiKey">API Key (x-api-key)</label>
                <input type="text" id="apiKey" value="AIzaSyCAmQkvx2SR-n_rS3IyZRUMreV87nWHEMM">
            </div>
        </div>

        <div class="config-section">
            <h2>🧪 エンドポイントテスト</h2>
            <div class="button-group">
                <button onclick="testEndpoint('/health')">
                    💚 Health Check
                </button>
                <button onclick="testEndpoint('/api/hello')">
                    👋 Hello
                </button>
                <button onclick="testEndpoint('/api/items')">
                    📦 Items
                </button>
                <button onclick="testAllEndpoints()">
                    🔄 全テスト実行
                </button>
            </div>
        </div>

        <div class="config-section">
            <h2>🤖 Botシミュレーション (reCAPTCHAテスト)</h2>
            <div class="button-group">
                <button onclick="testBotSimulation('invalid_token')" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                    🚫 無効なトークンで送信
                </button>
                <button onclick="testBotSimulation('no_token')" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                    ⛔ トークンなしで送信
                </button>
            </div>
        </div>

        <div class="response-section">
            <h2>📄 レスポンス</h2>
            <div id="response">ボタンをクリックしてAPIをテストしてください...</div>
        </div>
    </div>

    <script>
        // デフォルト値
        const DEFAULT_GATEWAY_URL = 'api-gateway-dh1fxfxf.an.gateway.dev';
        const DEFAULT_API_KEY = 'AIzaSyA5rh9l0H1IJyvdr1b3xs-0CPqTD6OYLIE';

        // LocalStorageからURLとAPIキーを復元（なければデフォルト値を使用）
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('gatewayUrl');
            const savedApiKey = localStorage.getItem('apiKey');

            if (savedUrl) {
                document.getElementById('gatewayUrl').value = savedUrl;
            }
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
        });

        // URLとAPIキーを保存
        document.getElementById('gatewayUrl').addEventListener('change', (e) => {
            localStorage.setItem('gatewayUrl', e.target.value);
        });

        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('apiKey', e.target.value);
        });

        async function testEndpoint(endpoint) {
            const gatewayUrl = document.getElementById('gatewayUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const responseDiv = document.getElementById('response');

            if (!gatewayUrl) {
                responseDiv.innerHTML = '<span class="error">❌ エラー: API Gateway URLを入力してください</span>';
                return;
            }

            if (!apiKey) {
                responseDiv.innerHTML = '<span class="error">❌ エラー: API Keyを入力してください</span>';
                return;
            }

            // プロトコルを追加（入力されていない場合）
            const baseUrl = gatewayUrl.startsWith('http') ? gatewayUrl : `https://${gatewayUrl}`;
            const url = `${baseUrl}${endpoint}`;

            responseDiv.innerHTML = `<span class="loading">⏳ reCAPTCHA検証中...</span>`;

            // // reCAPTCHAトークンの取得
            // let recaptchaToken;
            // try {
            //     recaptchaToken = await grecaptcha.execute('6LcliBUsAAAAAB5dr1cA_iIZOXHU_wFvMYH7qSop', {action: 'api_call'});
            // } catch (error) {
            //     responseDiv.innerHTML = `<span class="error">❌ reCAPTCHAエラー: ${error.message}</span>`;
            //     return;
            // }

            responseDiv.innerHTML = `<span class="loading">⏳ リクエスト中: ${endpoint}</span>`;

            const startTime = performance.now();

            // ヘッダーの準備（APIキーとreCAPTCHAトークンを含む）
            const headers = {
                'Accept': 'application/json',
                'x-api-key': 'AIzaSyA5rh9l0H1IJyvdr1b3xs-0CPqTD6OYLIE',
                // 'x-recaptcha-token': recaptchaToken,
            };

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: headers,
                });

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                const data = await response.json();

                let output = `<span class="success">✅ レスポンス受信成功</span>\n\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>ステータス:</strong> ${response.status} ${response.statusText}\n`;
                output += `<strong>レスポンス時間:</strong> ${duration}ms\n\n`;
                output += `<strong>レスポンスボディ:</strong>\n`;
                output += JSON.stringify(data, null, 2);

                responseDiv.innerHTML = output;

            } catch (error) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                let output = `<span class="error">❌ エラーが発生しました</span>\n\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>エラー内容:</strong> ${error.message}\n`;
                output += `<strong>経過時間:</strong> ${duration}ms\n\n`;

                if (error.message.includes('Failed to fetch')) {
                    output += `<strong>考えられる原因:</strong>\n`;
                    output += `- リファラー制限: このHTMLをローカルホスト（file://、http://localhost:*）から開いているか確認\n`;
                    output += `- APIキーが間違っている可能性があります\n`;
                    output += `- CORS設定を確認してください\n`;
                    output += `- URLが間違っている可能性があります\n`;
                    output += `- ネットワーク接続を確認してください\n`;
                }

                responseDiv.innerHTML = output;
            }
        }

        async function testAllEndpoints() {
            const endpoints = ['/health', '/api/hello', '/api/items'];
            const responseDiv = document.getElementById('response');

            responseDiv.innerHTML = '<span class="loading">⏳ 全エンドポイントをテスト中...</span>\n\n';

            for (const endpoint of endpoints) {
                await testEndpoint(endpoint);
                await new Promise(resolve => setTimeout(resolve, 500)); // 500ms待機
            }
        }

        async function testBotSimulation(testType) {
            const gatewayUrl = document.getElementById('gatewayUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const responseDiv = document.getElementById('response');
            const endpoint = '/health';

            if (!gatewayUrl) {
                responseDiv.innerHTML = '<span class="error">❌ エラー: API Gateway URLを入力してください</span>';
                return;
            }

            if (!apiKey) {
                responseDiv.innerHTML = '<span class="error">❌ エラー: API Keyを入力してください</span>';
                return;
            }

            const baseUrl = gatewayUrl.startsWith('http') ? gatewayUrl : `https://${gatewayUrl}`;
            const url = `${baseUrl}${endpoint}`;

            let testDescription = '';
            let recaptchaToken = null;

            if (testType === 'invalid_token') {
                testDescription = '無効なトークンを送信';
                recaptchaToken = 'INVALID_TOKEN_FOR_TESTING_' + Date.now();
                responseDiv.innerHTML = `<span class="loading">🚫 ${testDescription}中...</span>`;
            } else if (testType === 'no_token') {
                testDescription = 'トークンなしで送信';
                recaptchaToken = null;
                responseDiv.innerHTML = `<span class="loading">⛔ ${testDescription}中...</span>`;
            }

            const startTime = performance.now();

            const headers = {
                'Accept': 'application/json',
                'x-api-key': apiKey,
            };

            // トークンがある場合のみヘッダーに追加
            if (recaptchaToken) {
                headers['x-recaptcha-token'] = recaptchaToken;
            }

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: headers,
                });

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                let output = '';

                if (response.status === 403) {
                    output = `<span class="success">✅ 期待通りブロックされました！</span>\n\n`;
                } else if (response.status === 200) {
                    output = `<span class="error">⚠️ 警告: ブロックされるべきでしたが、成功しました</span>\n\n`;
                } else {
                    output = `<span class="error">❌ 予期しないステータス</span>\n\n`;
                }

                output += `<strong>テストタイプ:</strong> ${testDescription}\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>ステータス:</strong> ${response.status} ${response.statusText}\n`;
                output += `<strong>レスポンス時間:</strong> ${duration}ms\n\n`;
                output += `<strong>レスポンスボディ:</strong>\n`;
                output += typeof data === 'object' ? JSON.stringify(data, null, 2) : data;

                responseDiv.innerHTML = output;

            } catch (error) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                let output = `<span class="error">❌ エラーが発生しました</span>\n\n`;
                output += `<strong>テストタイプ:</strong> ${testDescription}\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>エラー内容:</strong> ${error.message}\n`;
                output += `<strong>経過時間:</strong> ${duration}ms\n`;

                responseDiv.innerHTML = output;
            }
        }
    </script>
</body>
</html>

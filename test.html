<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Server Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .config-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .config-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .response-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .response-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        #response {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        .error {
            color: #e74c3c;
            font-weight: 600;
        }

        .success {
            color: #27ae60;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box p {
            color: #1976d2;
            margin: 5px 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 API Server Test</h1>

        <div class="config-section">
            <h2>⚙️ 設定</h2>
            <div class="info-box">
                <p><strong>手順:</strong> 下記コマンドでAPI Gateway URLを取得して設定してください</p>
                <p><code>gcloud api-gateway gateways describe api-gateway --location asia-northeast1 --format 'value(defaultHostname)'</code></p>
            </div>
            <div class="input-group">
                <label for="gatewayUrl">API Gateway URL</label>
                <input type="text" id="gatewayUrl" placeholder="例: api-gateway-xxxxx.gateway.dev">
            </div>
        </div>

        <div class="config-section">
            <h2>🧪 エンドポイントテスト</h2>
            <div class="button-group">
                <button onclick="testEndpoint('/health')">
                    💚 Health Check
                </button>
                <button onclick="testEndpoint('/api/hello')">
                    👋 Hello
                </button>
                <button onclick="testEndpoint('/api/items')">
                    📦 Items
                </button>
                <button onclick="testAllEndpoints()">
                    🔄 全テスト実行
                </button>
            </div>
        </div>

        <div class="response-section">
            <h2>📄 レスポンス</h2>
            <div id="response">ボタンをクリックしてAPIをテストしてください...</div>
        </div>
    </div>

    <script>
        // LocalStorageからURLを復元
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('gatewayUrl');
            if (savedUrl) {
                document.getElementById('gatewayUrl').value = savedUrl;
            }
        });

        // URLを保存
        document.getElementById('gatewayUrl').addEventListener('change', (e) => {
            localStorage.setItem('gatewayUrl', e.target.value);
        });

        async function testEndpoint(endpoint) {
            const gatewayUrl = document.getElementById('gatewayUrl').value.trim();
            const responseDiv = document.getElementById('response');

            if (!gatewayUrl) {
                responseDiv.innerHTML = '<span class="error">❌ エラー: API Gateway URLを入力してください</span>';
                return;
            }

            // プロトコルを追加（入力されていない場合）
            const baseUrl = gatewayUrl.startsWith('http') ? gatewayUrl : `https://${gatewayUrl}`;
            const url = `${baseUrl}${endpoint}`;

            responseDiv.innerHTML = `<span class="loading">⏳ リクエスト中: ${endpoint}</span>`;

            const startTime = performance.now();

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                });

                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                const data = await response.json();

                let output = `<span class="success">✅ レスポンス受信成功</span>\n\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>ステータス:</strong> ${response.status} ${response.statusText}\n`;
                output += `<strong>レスポンス時間:</strong> ${duration}ms\n\n`;
                output += `<strong>レスポンスボディ:</strong>\n`;
                output += JSON.stringify(data, null, 2);

                responseDiv.innerHTML = output;

            } catch (error) {
                const endTime = performance.now();
                const duration = (endTime - startTime).toFixed(2);

                let output = `<span class="error">❌ エラーが発生しました</span>\n\n`;
                output += `<strong>エンドポイント:</strong> ${endpoint}\n`;
                output += `<strong>URL:</strong> ${url}\n`;
                output += `<strong>エラー内容:</strong> ${error.message}\n`;
                output += `<strong>経過時間:</strong> ${duration}ms\n\n`;

                if (error.message.includes('Failed to fetch')) {
                    output += `<strong>考えられる原因:</strong>\n`;
                    output += `- CORS設定が必要な可能性があります\n`;
                    output += `- URLが間違っている可能性があります\n`;
                    output += `- ネットワーク接続を確認してください\n`;
                }

                responseDiv.innerHTML = output;
            }
        }

        async function testAllEndpoints() {
            const endpoints = ['/health', '/api/hello', '/api/items'];
            const responseDiv = document.getElementById('response');

            responseDiv.innerHTML = '<span class="loading">⏳ 全エンドポイントをテスト中...</span>\n\n';

            for (const endpoint of endpoints) {
                await testEndpoint(endpoint);
                await new Promise(resolve => setTimeout(resolve, 500)); // 500ms待機
            }
        }
    </script>
</body>
</html>

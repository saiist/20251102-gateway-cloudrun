swagger: '2.0'
info:
  title: API Server
  description: Cloud Run API Server with API Gateway
  version: 1.0.0
host: YOUR_GATEWAY_HOST
schemes:
  - https
produces:
  - application/json

x-google-backend:
  address: YOUR_CLOUD_RUN_URL
  protocol: h2

paths:
  /health:
    options:
      summary: CORS preflight for health check
      operationId: healthCheckOptions
      security: []
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string

  /api/hello:
    options:
      summary: CORS preflight for hello
      operationId: helloOptions
      security: []
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Hello endpoint
      operationId: hello
      responses:
        '200':
          description: Success
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: object

  /api/items:
    options:
      summary: CORS preflight for items
      operationId: getItemsOptions
      security: []
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Get items
      operationId: getItems
      responses:
        '200':
          description: Items retrieved successfully
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string

securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header

# すべてのエンドポイントにAPI Keyを要求（リファラー制限付き）
security:
  - api_key: []

swagger: '2.0'
info:
  title: API Server
  description: Cloud Run API Server with API Gateway
  version: 1.0.0
host: YOUR_GATEWAY_HOST
schemes:
  - https
produces:
  - application/json

# ==========================================
# バックエンド設定 (全体共通)
# ==========================================
# 各パスで個別に指定しない限り、全てここに転送される
x-google-backend:
  address: YOUR_CLOUD_RUN_URL
  protocol: h2 # Cloud Run は h2 (HTTP/2) 推奨

# ==========================================
# クォータ(制限)の設定定義
# ==========================================
x-google-management:
  metrics:
    # 制限に使用するカウンター(指標)を定義
    - name: "my-api-requests-limit"
      displayName: "API Request Limit"
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      # 具体的な制限ルールを定義
      - name: "limit-per-project"
        metric: "my-api-requests-limit"
        unit: "1/min/{project}" # プロジェクト(APIキー)単位で、1分間あたりの制限
        values:
          STANDARD: 5000 # 1分間に5000回までのリクエストを許可

paths:
  # ----------------------------------------
  # ヘルスチェック (認証なし)
  # ----------------------------------------
  /health:
    options:
      summary: CORS preflight for health check
      operationId: healthCheckOptions
      security: [] # CORSは常に認証なし
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object

  # ----------------------------------------
  # 一般API (認証あり)
  # ----------------------------------------
  /api/hello:
    options:
      summary: CORS preflight for hello
      operationId: helloOptions
      security: []
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Hello endpoint
      operationId: hello
      responses:
        '200':
          description: Success
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object

  /api/items:
    options:
      summary: CORS preflight for items
      operationId: getItemsOptions
      security: []
      responses:
        '200':
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              type: string
            Access-Control-Allow-Methods:
              type: string
            Access-Control-Allow-Headers:
              type: string
      x-google-backend:
        address: YOUR_CLOUD_RUN_URL
    get:
      summary: Get items
      operationId: getItems
      # このAPIは課金対象なのでカウントを進める
      x-google-quota:
        metricCosts:
          "my-api-requests-limit": 1
      responses:
        '200':
          description: Items retrieved successfully
          headers:
            Access-Control-Allow-Origin:
              type: string
          schema:
            type: object

# ==========================================
# セキュリティ定義
# ==========================================
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header

# デフォルト設定: 特に指定がないパスは全てAPIキーを必須とする
security:
  - api_key: []
